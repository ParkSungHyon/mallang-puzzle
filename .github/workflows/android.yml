name: Build Android app

on:
  push:
    branches: [main]
    paths-ignore: ["release/**", "store/**", "*.md", "privacy.html"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Copy the game into the app
        run: |
          A=android/app/src/main/assets
          mkdir -p $A/fonts
          cp index.html $A/index.html
          cp fonts/*.woff2 $A/fonts/

      - name: Unlock signing key
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::warning::KS_PASS secret is not set. Only the test APK will be built."
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/upload-keystore.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass "pass:$KS_PASS"
          echo "KS_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: upload
        run: |
          if [ -n "$KS_FILE" ]; then
            gradle bundleRelease assembleRelease --no-daemon
          else
            gradle bundleRelease assembleDebug --no-daemon
          fi

      - name: Save files into release folder
        run: |
          mkdir -p release
          if [ -n "$KS_FILE" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab release/mallang-puzzle.aab
            cp android/app/build/outputs/apk/release/app-release.apk release/mallang-puzzle.apk
          else
            cp android/app/build/outputs/bundle/release/app-release.aab release/mallang-puzzle-unsigned.aab
            cp android/app/build/outputs/apk/debug/app-debug.apk release/mallang-puzzle-test.apk
          fi
          echo "build ${GITHUB_RUN_NUMBER} ($(date -u +%F))" > release/VERSION.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add release
          git commit -m "build: app ${GITHUB_RUN_NUMBER}" || exit 0
          git pull --rebase -q
          git push
